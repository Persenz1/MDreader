<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f7a6e"/>
      <stop offset="55%" stop-color="#1b5e56"/>
      <stop offset="100%" stop-color="#134e48"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6f4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a2e2a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bg)"/>
  <!-- subtle inner ring -->
  <rect x="10" y="10" width="236" height="236" rx="44" ry="44" fill="none" stroke="#7dcdc0" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Document page -->
  <g filter="url(#soft)">
    <path d="M68 48h78l36 36v124a12 12 0 0 1-12 12H68a12 12 0 0 1-12-12V60a12 12 0 0 1 12-12z" fill="url(#page)"/>
    <!-- folded corner -->
    <path d="M146 48v28a8 8 0 0 0 8 8h28l-36-36z" fill="#c5e4de"/>
    <path d="M146 48l36 36h-28a8 8 0 0 1-8-8V48z" fill="#a8d5cc"/>
  </g>

  <!-- Math: display integral block -->
  <g transform="translate(0,4)" fill="#1b5e56">
    <!-- ∫ display -->
    <path d="M118 78c-10 0-14 5-14 12 0 18 22 18 22 38 0 10-6 16-16 16-7 0-12-2-16-5"
          fill="none" stroke="#1b5e56" stroke-width="7" stroke-linecap="round"/>
    <path d="M148 92h28" stroke="#1b5e56" stroke-width="5" stroke-linecap="round"/>
    <path d="M156 104h20" stroke="#1b5e56" stroke-width="5" stroke-linecap="round"/>
    <!-- fraction bar + terms -->
    <path d="M96 128h64" stroke="#1b5e56" stroke-width="4" stroke-linecap="round"/>
    <circle cx="112" cy="118" r="3.2" fill="#1b5e56"/>
    <circle cx="128" cy="118" r="3.2" fill="#1b5e56"/>
    <circle cx="144" cy="118" r="3.2" fill="#1b5e56"/>
    <path d="M108 140c8 8 24 8 32 0" fill="none" stroke="#1b5e56" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 158h56" stroke="#2a9d8f" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M100 172h40" stroke="#2a9d8f" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- accent dot (cursor / read mark) -->
  <circle cx="196" cy="188" r="10" fill="#5eead4"/>
  <circle cx="196" cy="188" r="4" fill="#134e48"/>
</svg>
