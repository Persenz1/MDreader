[package]
name = "researchmd"
version = "0.1.0"
description = "A lightweight desktop reader for scientific Markdown with full MathJax LaTeX support"
authors = ["ResearchMD"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "researchmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
